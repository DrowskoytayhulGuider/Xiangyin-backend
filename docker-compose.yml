# 使用说明 4.0 - 微服务架构版本
# 1. 使用docker-compose  宿主机不需要配置host来发现
# 2. 无需修改源码，根目录  docker-compose up 即可
# 3. 静静等待服务启动
services:
  pig-mysql:
    build:
      context: ./db
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: root
    restart: always
    container_name: pig-mysql
    image: pig-mysql
    command: --lower_case_table_names=1
    networks:
      - spring_cloud_default

  pig-redis:
    container_name: pig-redis
    image: registry.cn-hangzhou.aliyuncs.com/dockerhub_mirror/redis
    restart: always
    networks:
      - spring_cloud_default

  xiangyin-register:
    build:
      context: ./xiangyin-register
    restart: always
    container_name: xiangyin-register
    image: xiangyin-register
    ports:
      - 8848:8848
      - 9848:9848
      - 18080:18080
    networks:
      - spring_cloud_default

  xiangyin-gateway:
    build:
      context: ./xiangyin-gateway
    restart: always
    container_name: xiangyin-gateway
    image: xiangyin-gateway
    ports:
      - 9999:9999
    networks:
      - spring_cloud_default

  xiangyin-auth:
    build:
      context: ./xiangyin-auth
    restart: always
    container_name: xiangyin-auth
    image: xiangyin-auth
    networks:
      - spring_cloud_default

  xiangyin-upms:
    build:
      context: ./xiangyin-upms/xiangyin-upms-biz
    restart: always
    container_name: xiangyin-upms
    image: xiangyin-upms
    networks:
      - spring_cloud_default

  xiangyin-monitor:
    build:
      context: ./xiangyin-visual/xiangyin-monitor
    restart: always
    image: xiangyin-monitor
    container_name: xiangyin-monitor
    ports:
      - 5001:5001
    networks:
      - spring_cloud_default

  xiangyin-quartz:
    build:
      context: ./xiangyin-visual/xiangyin-quartz
    restart: always
    image: xiangyin-quartz
    container_name: xiangyin-quartz
    networks:
      - spring_cloud_default

  xiangyin-codegen:
    build:
      context: ./xiangyin-visual/xiangyin-codegen
    restart: always
    image: xiangyin-codegen
    container_name: xiangyin-codegen
    networks:
      - spring_cloud_default

networks:
  spring_cloud_default:
    name: spring_cloud_default
    driver: bridge
